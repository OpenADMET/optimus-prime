# Stage 1 of 2: a two-task ChemProp encoder on primary-screen log2FC.
# Never scored on its own; stage 2 reads it frozen. Run first, and pin the
# output directory, because stage 2 refers to it by path:
#
#   openadmet anvil --recipe-path chemprop_log2fc.yaml \
#       --output-dir chemprop_log2fc_model

# Section specifying input data
data:
  # One row per compound, one column per concentration arm
  resource: ../PXR_log2fc_single_concentration.parquet
  # must be intake
  type: intake
  # Specify input column containing SMILES
  input_col: OPENADMET_SMILES
  # Specify each (1+) of the target columns, or the column that you're trying to predict
  target_cols:
  - OPENADMET_LOG2FC_8_25uM
  - OPENADMET_LOG2FC_33uM
  # 1,390 compounds were screened at one concentration only; ChemProp masks the
  # missing target out of the loss rather than dropping the row's other arm
  dropna: False

# Additional metadata
metadata:
  authors: Sean M Colby
  email: sean.colby@omsf.io
  biotargets:
  - PXR
  build_number: 0
  description: two-task ChemProp regression on PXR primary-screen log2FC, used as a frozen featurizer by the stage 2 recipe
  driver: pytorch
  name: pxr_log2fc_chemprop
  tag: openadmet-PXR-log2fc-chemprop
  tags:
  - openadmet
  - PXR
  - log2fc
  - transfer-learning
  version: v1

# Section specifying training procedure
procedure:
  # Global seed; any section without its own random_seed inherits this
  random_seed: 42

  # Featurization specification
  feat:
    # See openadmet.models.features
    type: ChemPropFeaturizer
    params:
      batch_size: 64
      normalize_targets: true
      n_jobs: 4
      # Shuffle training batches each epoch; eval and inference loaders stay ordered
      shuffle: true

  # Model specification
  model:
    # See openadmet.models.architecture
    type: ChemPropModel
    params:
      # Must match the number of target columns
      n_tasks: 2
      messages: bond
      aggregation: mean
      depth: 3
      message_hidden_dim: 256
      ffn_hidden_dim: 512
      ffn_num_layers: 2
      normalized_targets: True
      dropout: 0.0
      batch_norm: False
      # Noam calibrates its decay against max_epochs below: ramp for 2 epochs,
      # decay to the floor over the remaining 3
      scheduler: noam
      warmup_epochs: 2
      max_lr: 1e-3
      weight_decay: 0.0
      # No validation split, so the trainer checkpoints on training loss
      monitor_metric: train_loss
      monitor_metric_mode: min

  # Specify data splits
  split:
    # See openadmet.models.split
    type: ShuffleSplitter
    # Every compound trains the encoder, as in the analysis's refit pass
    params:
      random_seed: 42
      train_size: 1.0
      val_size: 0.0
      test_size: 0.0

  # Specify training configuration
  train:
    # See openadmet.models.trainer
    type: LightningTrainer
    params:
      accelerator: gpu
      gradient_clip_val: 1.0
      # The analysis's five refits ran 7, 5, 3, 7 and 5 epochs; 5 is the median.
      # Early stopping would need a validation loss, and there is no val split
      early_stopping: false
      max_epochs: 5
      deterministic: False
      use_wandb: false
      wandb_project: demos # Specify wandb project name according to guidelines

# Section specifying report generation
report:
  # Nothing to score: no test split, and this network is read only by stage 2
  eval: []
