# Stage 2 of 2: the dose-response model that consumes the log2FC encoder.
#
# Features are a CheMeleon embedding PCA-reduced to 256 components, concatenated
# with the two log2FC predictions the stage 1 network emits, giving TabICL 258
# columns. This is the configuration the PXR challenge analysis carried forward,
# fit and scored on the partitions it used; see ../README.md.
#
# Stage 1 must have run first, and model_dir below must point at its output:
#
#   openadmet anvil --recipe-path tabicl_pec50.yaml

# Section specifying input data
data:
  # The challenge's own evaluation split, not a random one: fit on the
  # dose-response training set pooled with phase 1, score on the blinded phase 2
  # set alone. A metric from these files is comparable to the published numbers
  train_resource: ../PXR_pEC50_fit.parquet
  test_resource: ../PXR_pEC50_test_phase2.parquet
  # must be intake
  type: intake
  # Specify input column containing SMILES
  input_col: OPENADMET_SMILES
  # Specify each (1+) of the target columns, or the column that you're trying to predict
  target_cols:
  - OPENADMET_PEC50
  # Specify whether or not to drop NaN data rows
  dropna: true

# Additional metadata
metadata:
  authors: Sean M Colby
  email: sean.colby@omsf.io
  biotargets:
  - PXR
  build_number: 0
  description: PXR pEC50 regression with TabICL over a PCA-reduced CheMeleon embedding concatenated with frozen log2FC predictions
  driver: sklearn
  name: pxr_pec50_tabicl
  tag: openadmet-PXR-pec50-tabicl
  tags:
  - openadmet
  - PXR
  - pec50
  - tabicl
  - transfer-learning
  version: v1

# Section specifying training procedure
procedure:
  # Global seed; any section without its own random_seed inherits this
  random_seed: 42

  # Featurization specification
  feat:
    # Using concatenated features, which combines multiple featurizers
    # See openadmet.models.features
    type: FeatureConcatenator
    params:
      featurizers:
        # Off-the-shelf CheMeleon encoder, 2,048 pooled MPNN dimensions. The
        # log2FC-fine-tuned embedding was nominally better in the analysis but
        # statistically tied, and it would need a third trained model to ship
        - type: CheMeleonEmbeddingFeaturizer
          params:
            batch_size: 256
            accelerator: auto
        # The frozen stage 1 network, emitting one column per concentration arm.
        # Relative to this recipe file, so stage 1 must have been run with
        # --output-dir chemprop_log2fc_model
        - type: TrainedModelFeaturizer
          params:
            model_dir: ../chemprop_log2fc/chemprop_log2fc_model
            accelerator: auto

  # Transform specification, fitted on the fit partition only and reapplied to
  # phase 2 at scoring time
  # See openadmet.models.transforms
  transform:
  - type: PCATransform
    params:
      # Blocks are keyed and ordered by featurizer class name, so the CheMeleon
      # block comes first here regardless of the order listed above. Reductions
      # to 256, 384 and 512 were statistically tied in the analysis and 256 is
      # the cheapest of them; below 128 was clearly separated and worse
      n_components:
        CheMeleonEmbeddingFeaturizer: 256
        # Passed through unreduced: two columns that each mean a specific
        # concentration's log2FC, which a PCA would rotate into linear
        # combinations without reducing the width at all
        TrainedModelFeaturizer: null
      # Mean imputation ahead of each block's PCA, matching the analysis. Neither
      # block should carry a missing value, so this is a guard rather than a fix
      impute_strategy: mean
      random_seed: 42

  # Model specification
  model:
    # Indicate model type
    # See openadmet.models.architecture
    type: TabICLRegressorModel
    # Specify model parameters
    params:
      random_seed: 42
      n_estimators: 8
      # CPU rather than the accelerator, and not by preference. At 4,392 rows
      # and 258 columns TabICL asks for 9.5 GiB on top of the 14 GiB it already
      # holds, which does not fit in 24 GiB, and the three settings below are
      # already at their cheapest. On CPU it fits, in about 160 seconds
      accelerator: cpu
      batch_size: 1
      kv_cache: false
      offload_mode: cpu

  # Specify data splits
  split:
    # Inert: train_resource and test_resource above are read directly, so the
    # splitter never runs. The section is required by the recipe schema
    # See openadmet.models.split
    type: ShuffleSplitter
    params:
      random_seed: 42
      train_size: 0.7
      val_size: 0.1
      test_size: 0.2

  # Specify training configuration
  train:
    # Specify the trainer, here SKLearnBasicTrainer for sklearn models
    # See openadmet.models.trainer
    type: SKLearnBasicTrainer

# Section specifying report generation
report:
  # Configure evaluation
  eval:
  # Generate regression metrics, on the 260 phase 2 compounds
  - type: RegressionMetrics
    params:
      pXC50: True
  # Generate regression plots
  - type: RegressionPlots
    params:
      axes_labels:
      - True pEC50
      - Predicted pEC50
      max_val: 8
      min_val: 2
      pXC50: True
      title: PXR True vs Predicted pEC50 on phase 2 test set
