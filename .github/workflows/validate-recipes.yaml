name: Validate recipes

# Builds every canonical recipe against the latest openadmet-models main, so a
# renamed or removed parameter upstream shows up here instead of on a cluster.
# No data is loaded and nothing is trained.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, to catch upstream API changes between edits to this repo
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out openadmet-models
        uses: actions/checkout@v4
        with:
          repository: OpenADMET/openadmet-models
          ref: main
          path: openadmet-models

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: openadmet-models/devtools/conda-envs/openadmet-models.yaml
          environment-name: openadmet-models
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            python=3.12

      - name: Install openadmet-models
        shell: bash -l {0}
        run: python -m pip install ./openadmet-models --no-deps

      - name: Validate recipes
        shell: bash -l {0}
        run: python scripts/validate_recipes.py

      # Same notifier as models-ci. Skipped on pull requests, where fork runs
      # have no access to secrets and the PR checks already report the result.
      - name: Post failure to Slack Channel
        if: ${{ failure() && github.event_name != 'pull_request' }}
        id: slack_failure
        uses: slackapi/slack-github-action@v2.1.1
        with:
            method: chat.postMessage
            token: ${{ secrets.SLACK_BOT_TOKEN }}
            payload: |
              channel: ${{ secrets.SLACK_CHANNEL }}
              text: "❌ *Canonical Recipe Validation Failed*\n*Repo:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

      - name: Post success to Slack Channel
        if: ${{ success() && github.event_name != 'pull_request' }}
        id: slack_success
        uses: slackapi/slack-github-action@v2.1.1
        with:
            method: chat.postMessage
            token: ${{ secrets.SLACK_BOT_TOKEN }}
            payload: |
              channel: ${{ secrets.SLACK_CHANNEL }}
              text: "✅ *Canonical Recipe Validation Succeeded*\n*Repo:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Results>"
